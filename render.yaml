# Render Blueprint for the DMS demo — see DEPLOY.md for the full walkthrough
# (Aiven MySQL setup, secret values, and what to click where).
#
# Two services, one repo: the API needs a rootDir because this is a monorepo,
# and the static site needs REACT_APP_API_BASE baked in at *build* time — a
# React env var is not readable at runtime, so the API's URL has to be known
# before this file is applied. It is: Render URLs are `<name>.onrender.com`,
# so the names below are fixed on purpose rather than left to Render to pick.
services:
  - type: web
    name: dms-demo-api
    runtime: node
    plan: free
    rootDir: backend
    # Migrations run on every deploy, not by hand from somebody's laptop.
    #
    # They used to be a manual step in DEPLOY.md, and the gap did what gaps do:
    # 006 and 007 sat unapplied on Aiven while this service happily served the
    # code that expected them. Nothing looked broken — the project *list* never
    # touches `phase_transition.requires_signature`, so only opening a single
    # project 500'd, which is the kind of half-failure nobody notices until a
    # visitor finds it. `db:migrate` reads `schema_migration` and applies only
    # what it has not recorded, so re-running it on every deploy is a no-op
    # once the schema is current.
    #
    # A failed migration now fails the whole build, and that is the point: this
    # service keeps serving the previous deploy rather than starting against a
    # schema it disagrees with.
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app and forwards over plain
      # HTTP from one hop away — this is what makes `req.ip` (and therefore
      # the per-address login-guess budget) mean the caller, not Render.
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_PROVIDER
        value: mock
      # The demo's front door — see config.js. Both required together in
      # production, and deliberately not defaulted here: fill them in on the
      # dashboard (DEPLOY.md has the exact commands to generate them).
      - key: ALLOW_MOCK_AUTH
        value: "1"
      - key: MOCK_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      # dms-demo was also taken, so the live frontend landed at
      # dms-demo-kw69 — same trap as the API's own name above. This has to
      # track whatever the frontend's actual URL turns out to be.
      - key: CORS_ORIGIN
        value: https://dms-demo-kw69.onrender.com
      - key: ACADEMIC_YEAR
        value: "2567"
      # Aiven's connection details — sync: false means the dashboard, not
      # this file, is where the actual values live.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      # Aiven requires TLS. This is the permissive fallback (encrypt, don't
      # verify the server's certificate against a CA) rather than
      # DB_SSL_CA_PATH's stricter pinned-CA path — one less manual step (no
      # Secret File to fetch from Aiven and upload) for what this demo needs.
      - key: DB_SSL
        value: "1"

  - type: web
    name: dms-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # `dms-demo-api` was already taken on Render when this was first
      # deployed, so the live API landed at `dms-demo-api-hqwa` instead —
      # DEPLOY.md's "check both names before deploying" warning, hit for
      # real. This has to track whatever the API's actual URL turns out to
      # be, not the name requested above.
      - key: REACT_APP_API_BASE
        value: https://dms-demo-api-hqwa.onrender.com
    # A client-routed SPA: every path that is not a real static file has to
    # still serve index.html, or refreshing anywhere but "/" is a 404.
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
